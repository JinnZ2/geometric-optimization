[tool.black]
line-length = 88
target-version = ["py38"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
# Current mypy releases reject python_version = "3.8", which made the CI
# type-check step error out instead of type checking anything.
python_version = "3.10"
files = ["gas", "meta_layer", "validation", "benchmarks"]
# The repository root carries an __init__.py while the directory name contains
# a hyphen, so mypy would otherwise infer an invalid package name for gas/.
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
