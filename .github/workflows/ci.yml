name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: flake8 gas/ meta_layer/ tests/

      - name: Type check with mypy
        run: mypy

      - name: Run tests
        run: pytest --cov=gas --cov=meta_layer --cov-report=term-missing

      # Re-decides every claim in validation/claims.json. Exits nonzero only on
      # a regression -- a claim that was SUPPORTED coming back FALSIFIED --
      # so already-falsified claims stay visible without blocking the build.
      - name: Re-test recorded claims
        run: python -m validation.scientific_method run

      - name: Fail if VALIDATION.md is stale
        run: git diff --exit-code VALIDATION.md validation/claims.json
